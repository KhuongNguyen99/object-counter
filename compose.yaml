name: yoloe-counter
services:
  frontend:
    build:
      context: ./frontend
    image: countwell-frontend:local
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080"
    environment:
      BACKEND_URL: "${BACKEND_URL:-http://counter:8080}"
      API_BASE_URL: "${API_BASE_URL:-}"
    depends_on:
      counter:
        condition: service_healthy
    restart: unless-stopped
    init: true
  counter:
    build:
      context: .
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: yoloe-counter:local
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8082}:8080"
    environment:
      DEVICE: ${DEVICE:-auto}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      FRONTEND_ORIGINS: "${FRONTEND_ORIGINS:-}"
    volumes:
      - counter-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
volumes:
  counter-data:
