name: yoloe-counter
services:
  counter:
    build:
      context: .
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: yoloe-counter:local
    network_mode: bridge
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080"
    environment:
      DEVICE: ${DEVICE:-auto}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
    volumes:
      - counter-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
volumes:
  counter-data:
